/**:
  ros__parameters:
    # Default (no Livox): stereo depth only. Livox bots use kiwi_3d_lidar.yaml
    # selected by elevation_mapping.launch.py when NODE_LIVOX_LIDAR=1.
    inputs: ["front_cam"]
    front_cam:
      type: pointcloud
      topic: /camera/depth/color/points
      override_frame_id: camera_depth_optical_frame_3d
      queue_size: 1
      publish_on_update: true
      sensor_processor:
        type: structured_light
        # Height gate relative to robot_base_frame_id (inertial_link_3d).
        ignore_points_above: 0.65
        ignore_points_below: -0.5
        cutoff_min_depth: 0.2
        cutoff_max_depth: 50.0
        normal_factor_a: 0.000611
        normal_factor_b: 0.003587
        normal_factor_c: 0.3515
        normal_factor_d: 0.0
        normal_factor_e: 1.0
        lateral_factor: 0.01576
        # STVL-style clearing: unseen cells inside this field of view decay faster (needs decay_time > 0).
        # Geometry measured on the color-aligned cloud (160x90, +-35 x +-21 deg), not the D435 depth FoV.
        frustum:
          model_type: depth_camera
          horizontal_fov_angle: 1.20   # [rad]
          vertical_fov_angle: 0.72     # [rad]
          min_range: 0.2               # [m] along the optical axis
          max_range: 10.0              # [m]
          decay_acceleration: 0.0      # [1/s^2] 0 = off (still drawn with publish_frustums); STVL rgbd_clear uses 5.0
    map_frame_id: "odom"
    robot_base_frame_id: "inertial_link_3d"
    robot_pose_with_covariance_topic: "/odometry/for_elevation"
    robot_pose_cache_size: 200
    track_point_frame_id: "inertial_link_3d"
    track_point_x: 0.0
    track_point_y: 0.0
    track_point_z: 0.0
